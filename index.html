<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turno de Meseros</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#222;
    color:white;
    height:100vh;
}

#configuracion{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    gap:18px;
}

input{
    width:300px;
    padding:12px;
    font-size:20px;
    border-radius:8px;
    border:none;
}

button{
    padding:12px 30px;
    font-size:20px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

#contenedorNombres{
    display:flex;
    flex-direction:column;
    gap:10px;
}

#pantalla{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:.3s;
    cursor:pointer;
}

#nombre{
    font-size:90px;
    font-weight:bold;
}

#finalizar{
    position:absolute;
    top:20px;
    right:20px;
    background:#d32f2f;
    color:white;
}

#resultado{
    display:none;
    padding:40px;
}

table{
    width:500px;
    border-collapse:collapse;
    margin:auto;
}

th,td{
    border:1px solid white;
    padding:12px;
    text-align:center;
}

th{
    background:#444;
}

</style>

</head>
<body>

<div id="configuracion">

<h1>Turno de Meseros</h1>

<input id="cantidad" type="number" min="1" placeholder="Cantidad de meseros">

<button onclick="crearCampos()">Continuar</button>

<div id="contenedorNombres"></div>

</div>

<div id="pantalla">

<button id="finalizar">Finalizar día</button>

<div id="nombre"></div>

</div>

<div id="resultado">

<h1 style="text-align:center;margin-bottom:30px;">Resumen del Día</h1>

<table id="tabla">

<tr>
<th>Mesero</th>
<th>Turnos</th>
</tr>

</table>

<br>

<center>
<button onclick="location.reload()">Nuevo Día</button>
</center>

</div>

<script>

let nombres=[];
let contador=[];
let indice=0;

const colores=[
"#f44336",
"#2196F3",
"#4CAF50",
"#FF9800",
"#9C27B0",
"#009688",
"#795548",
"#3F51B5",
"#E91E63",
"#607D8B",
"#673AB7",
"#8BC34A",
"#FFC107",
"#00BCD4",
"#FF5722"
];

function crearCampos(){

    const cantidad=parseInt(document.getElementById("cantidad").value);

    if(isNaN(cantidad)||cantidad<=0){
        alert("Cantidad inválida");
        return;
    }

    const cont=document.getElementById("contenedorNombres");

    cont.innerHTML="";

    for(let i=0;i<cantidad;i++){

        let input=document.createElement("input");

        input.placeholder="Nombre del mesero "+(i+1);

        cont.appendChild(input);

    }

    let boton=document.createElement("button");

    boton.innerHTML="Iniciar";

    boton.onclick=iniciar;

    cont.appendChild(boton);

}

function iniciar(){

    nombres=[];
    contador=[];

    const inputs=document.querySelectorAll("#contenedorNombres input");

    for(let i=0;i<inputs.length;i++){

        if(inputs[i].value.trim()==""){
            alert("Faltan nombres");
            return;
        }

        nombres.push(inputs[i].value);
        contador.push(1);

    }

    indice=0;

    document.getElementById("configuracion").style.display="none";

    document.getElementById("pantalla").style.display="flex";

    actualizarPantalla();

}

function actualizarPantalla(){

    document.getElementById("nombre").innerHTML=nombres[indice];

    document.getElementById("pantalla").style.background=
        colores[indice%colores.length];

}

document.getElementById("pantalla").addEventListener("click",function(e){

    if(e.target.id=="finalizar") return;

    indice=(indice+1)%nombres.length;

    contador[indice]++;

    actualizarPantalla();

});

document.getElementById("finalizar").onclick=function(){

    document.getElementById("pantalla").style.display="none";

    document.getElementById("resultado").style.display="block";

    let tabla=document.getElementById("tabla");

    for(let i=0;i<nombres.length;i++){

        tabla.innerHTML+=`
        <tr>
            <td style="background:${colores[i%colores.length]}">
                ${nombres[i]}
            </td>
            <td>${contador[i]}</td>
        </tr>
        `;

    }

}

</script>

</body>
</html>
